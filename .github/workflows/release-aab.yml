name: Compilar AAB (Google Play)

# Se lanza manualmente desde la pestaña Actions.
# Con estos secretos del repositorio genera un AAB FIRMADO, listo para subir a Play Console:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Sin ellos genera un AAB SIN FIRMAR, solo para validar que el build de release compila.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar Gradle wrapper (si falta)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Restaurar keystore (si existe el secreto)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "FIRMADO=si" >> "$GITHUB_ENV"
          else
            echo "::warning::No hay secreto KEYSTORE_BASE64: se generará un AAB SIN FIRMAR (solo validación)."
            echo "FIRMADO=no" >> "$GITHUB_ENV"
          fi

      - name: Compilar AAB de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Publicar el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMADO == 'si' && 'apuntate-release-aab' || 'apuntate-aab-SIN-FIRMAR' }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

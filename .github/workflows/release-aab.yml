name: Compilar AAB (Google Play)

# Se lanza manualmente desde la pestaña Actions.
# La clave de firma está cifrada en signing/upload.keystore.gpg. Con el secreto
# SIGNING_PASSPHRASE del repositorio se descifra y se genera un AAB FIRMADO.
# Sin ese secreto se genera un AAB SIN FIRMAR, solo para validar que el build compila.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar Gradle wrapper (si falta)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Descifrar keystore (si existe el secreto)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_PASSPHRASE" ]; then
            printf %s "$SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 -o "$RUNNER_TEMP/upload.keystore" -d signing/upload.keystore.gpg
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "FIRMADO=si" >> "$GITHUB_ENV"
          else
            echo "::warning::No hay secreto SIGNING_PASSPHRASE: se generará un AAB SIN FIRMAR (solo validación)."
            echo "FIRMADO=no" >> "$GITHUB_ENV"
          fi

      - name: Compilar AAB de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Publicar el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMADO == 'si' && 'apuntate-release-aab' || 'apuntate-aab-SIN-FIRMAR' }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

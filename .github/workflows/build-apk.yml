name: Compilar APK

# Compila el APK en la nube. Se ejecuta automáticamente en cada push a main
# y también se puede lanzar manualmente desde la pestaña "Actions".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generar Gradle wrapper (si falta)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: apuntate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Crear/actualizar una Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultimo-apk
          name: Último APK de Apuntate
          body: |
            APK de depuración generado automáticamente desde la última versión de `main`.
            Descarga `app-debug.apk`, cópialo a tu móvil Android e instálalo.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
